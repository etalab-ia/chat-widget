# Enforce a one-week minimum release age on newly published packages to limit
# exposure to supply-chain attacks (squad dependency policy).
minimumReleaseAge: 10080

# Build scripts are denied by default; allow only what the toolchain needs.
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  # Cloudflare's Workers runtime binary, required by the deployment toolchain.
  workerd: true

# Targeted security overrides for versions pinned by transitive parents.
overrides:
  glob@10: 10.5.0
  undici@7: 7.30.1

# Exact security-fix exceptions to the one-week release-age rule:
# body-parser 2.4.0 was published 2026-10-22; revisit after 2026-10-30.
# undici 7.30.1 was published 2026-10-19; revisit after 2026-10-27.
minimumReleaseAgeExclude:
  - body-parser@2.4.0
  - undici@7.30.1
