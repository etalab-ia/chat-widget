# Hooks pre-commit du projet.
# Installation : pre-commit install (voir README, section Développement).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: cve-lite
        name: CVE Lite (dépendances Node)
        entry: cve-lite . --fail-on high
        language: node
        additional_dependencies: ["cve-lite-cli@1.39.0"]
        pass_filenames: false
